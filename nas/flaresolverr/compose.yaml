# Solves Cloudflare challenges for Suwayomi (Panelhouse :4567 and Back Room :4568),
# so Cloudflare-protected sources like MangaFire and Manganato work.
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - 8191:8191
    environment:
      LOG_LEVEL: info
      TZ: America/Chicago
    restart: unless-stopped
